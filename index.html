<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#faf6ef">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<title>우리 아이 시간표</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* One child at a time. Tablet/landscape: planner + side column. Phone/portrait: planner, then info cards below.
   1rem = 16px at 1024x768; phone uses a clamp. */
:root{
  color-scheme:light dark;
  --bg:#faf6ef;--fg:#2a2420;--muted:#6f655b;--card:#ffffff;--soft:#f0e9de;--chip:#ffffff;
  --ok:#23805a;--on-ok:#ffffff;--now:#e5484d;--err:#b3261e;
  --font-n:"Jua","Noto Sans KR",sans-serif;
  --font-b:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
.pal-blue{--c:#2e6be6;--cs:#e3edff;--ci:#14316b;--cf:#ffffff}
.pal-yellow{--c:#ffc02e;--cs:#fff0c7;--ci:#4a3200;--cf:#4a3200}
.pal-pink{--c:#c93d74;--cs:#ffe1ec;--ci:#6b1236;--cf:#ffffff}
.pal-green{--c:#1f7a52;--cs:#dcf5e8;--ci:#0f4a2e;--cf:#ffffff}
@media (prefers-color-scheme: dark){
  :root{--bg:#17130f;--fg:#f4efe7;--muted:#b4a99c;--card:#241e18;--soft:#3a3128;--chip:#17130f;--ok:#3ecf8e;--on-ok:#08301f;--now:#ff6b6f;--err:#ff8a8d}
  .pal-blue{--c:#5b8cff;--cs:#1f2f55;--ci:#cfe0ff;--cf:#0e1b3a}
  .pal-yellow{--c:#ffc93c;--cs:#4a3b12;--ci:#ffe9a8;--cf:#3b2900}
  .pal-pink{--c:#ff7fae;--cs:#4d2236;--ci:#ffd3e4;--cf:#3d0f23}
  .pal-green{--c:#3ecf8e;--cs:#17402f;--ci:#c4f2dc;--cf:#08301f}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:min(1.5625vw,2.0833vh);height:100%}
body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font-family:var(--font-b);line-height:1.3;-webkit-user-select:none;user-select:none}
#app{height:100%;display:flex;flex-direction:column;gap:.75rem;padding-block:1.25rem;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font-family:inherit;color:inherit;border:0;background:none;padding:0;text-align:left;cursor:pointer}
.n{font-family:var(--font-n);font-weight:400}
.ic{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* top */
#top{display:flex;align-items:center;gap:1.25rem;flex:none;min-height:4rem;flex-wrap:wrap}
#tm{display:flex;align-items:center;gap:1.25rem;flex-wrap:wrap}
#bar{display:none}
#clock{font-size:3.5rem;line-height:1;white-space:nowrap}
#clock small{font-size:1.5rem;margin-right:.4rem;color:var(--muted)}
#clock .co.off{opacity:.3}
#date{font-size:1.25rem;color:var(--muted);white-space:nowrap}
#who{margin-left:auto;display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.chipk{height:2.75rem;padding:0 1.1rem;border-radius:1rem;background:var(--card);font-size:1.125rem;font-weight:700;display:flex;align-items:center;gap:.5rem}
.chipk.on{background:var(--c);color:var(--cf)}
.gear{width:2.75rem;height:2.75rem;border-radius:1rem;background:var(--card);display:grid;place-items:center;font-size:1.5rem}

/* tabs */
#tabs{display:flex;gap:.5rem;align-items:center;flex:none;flex-wrap:wrap}
.seg{height:2.5rem;padding:0 1.25rem;border-radius:.9rem;background:var(--card);font-size:1.125rem;font-weight:500;display:flex;align-items:center;gap:.5rem}
.seg.on{background:var(--fg);color:var(--bg)}
.seg.live::after{content:"";width:.6rem;height:.6rem;border-radius:50%;background:var(--now)}
#tabs .sp{flex:1}
#tabs .hint{font-size:1.125rem;color:var(--muted)}

/* board */
#main{flex:1;min-height:0;display:flex;gap:1rem}
.board{flex:1;min-width:0;display:flex;gap:1rem}
.axis{width:2.75rem;display:flex;flex-direction:column;flex:none}
.axis .sp{height:7.25rem;flex:none}
.axis .ax{flex:1;position:relative;overflow:hidden;min-height:0}
.axi{position:relative}
.axis .ax span{position:absolute;right:0;transform:translateY(-50%);font-size:1.125rem;color:var(--muted)}
.kcol{flex:1;display:flex;flex-direction:column;min-width:0}
.kh{height:4.5rem;display:flex;align-items:center;gap:.75rem;padding:0 .25rem;width:100%}
.kh .catx{width:3.75rem;height:3.75rem;flex:none;display:block}
.kh .nm{font-size:1.75rem;font-weight:700;line-height:1.1;white-space:nowrap;min-width:0}
.kh .nm small{display:block;font-size:1.125rem;font-weight:400;color:var(--muted)}
.kh .left{margin-left:auto;font-size:1.125rem;font-weight:700;border-radius:.9rem;padding:.4rem .9rem;text-align:center;white-space:nowrap;background:var(--cs);color:var(--ci)}
.kh .left.done{background:var(--ok);color:var(--on-ok)}
.ad{height:2.75rem;display:flex;align-items:center;gap:.5rem;padding:0 .25rem;overflow:hidden;white-space:nowrap}
.ad .al{font-size:1.125rem;color:var(--muted)}
.tl{position:relative;flex:1;border-radius:1.25rem;background:var(--card);overflow-x:hidden;overflow-y:auto;min-height:0;touch-action:pan-y;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;scrollbar-width:none}
.tl::-webkit-scrollbar{display:none}
.tli{position:relative;width:100%}
.tl .gl{position:absolute;left:0;right:0;border-top:.125rem solid var(--soft)}
.chipx{background:var(--chip);color:var(--fg);border-radius:.75rem;padding:.2rem .75rem .2rem .45rem;font-size:1.125rem;font-weight:500;display:inline-flex;gap:.5rem;align-items:center;cursor:pointer;line-height:1.3}
.chipx i{width:1.4rem;height:1.4rem;border-radius:.45rem;border:.125rem solid var(--muted);display:grid;place-items:center;font-style:normal;color:#fff;font-size:1rem;flex:none}
.chipx.on{text-decoration:line-through;color:var(--muted)}.chipx.on i{background:var(--ok);border-color:var(--ok)}
.b{position:absolute;border-radius:.9rem;padding:.3rem .75rem;overflow:hidden;overflow:clip;cursor:pointer;display:block;background:var(--cs);color:var(--ci)}
.b.now{background:var(--c);color:var(--cf);box-shadow:0 .4rem 1rem rgba(0,0,0,.18);outline:.15rem solid var(--ci);outline-offset:-.15rem;z-index:2}
.b.past{opacity:.7}
.b .bt{display:flex;align-items:baseline;gap:.5rem;white-space:nowrap;line-height:1.3;position:sticky;top:0;background:inherit;z-index:1}
.b .tt{font-size:1.2rem;font-weight:700}
.b small{font-size:1.125rem;font-weight:400;opacity:.8}
.b .pg{margin-left:auto;font-size:1.125rem;font-weight:700;background:var(--card);color:var(--fg);border-radius:.7rem;padding:0 .5rem;display:none}
.b .pg.ok{background:var(--ok);color:#fff}
.b .tk{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.3rem}
.nowln{position:absolute;left:0;right:0;height:0;border-top:.2rem solid var(--now);z-index:3;pointer-events:none}
.nowln::before{content:"";position:absolute;left:-.05rem;top:-.5rem;width:.8rem;height:.8rem;border-radius:50%;background:var(--now)}

/* side */
.side{width:14.25rem;display:flex;flex-direction:column;gap:1.1rem;padding-top:.25rem;flex:none;overflow:hidden}
.wr{display:flex;align-items:center;gap:.75rem;font-size:1.25rem;font-weight:500;position:relative}
.wr .ic{font-size:2.1rem;flex:none}.wr small{display:block;font-size:1.125rem;color:var(--muted);font-weight:400}
.tag{font-size:1rem;background:var(--soft);color:var(--muted);border-radius:.5rem;padding:0 .4rem;margin-left:auto}
.qt{width:100%;display:flex;flex-direction:column;gap:.25rem;background:var(--soft);border-radius:1rem;padding:.6rem .8rem;margin-top:auto}
.qt .lb{font-size:1.125rem;color:var(--muted);display:flex;gap:.5rem;align-items:center}
.qt .q{font-family:var(--font-n);font-size:1.5rem;line-height:1.3}
.qt .w{font-size:1.125rem;color:var(--muted);text-align:right}

/* sheet */
#sheet{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(30,20,10,.5);z-index:20;padding:1rem}
#sheet.show{display:flex}
#sbox{background:var(--card);border-radius:1.75rem;padding:1.5rem;width:min(40rem,100%);max-height:100%;overflow:auto;-webkit-user-select:text;user-select:text}
#sbox h3{font-size:1.75rem;margin:0 0 .25rem;font-weight:700}
#sbox .sub{color:var(--muted);font-size:1.125rem;margin:0 0 .75rem}
#sbox .sec{font-size:1.125rem;font-weight:700;margin:1rem 0 .4rem}
#sbox .note{color:var(--muted);font-size:1.125rem}
.big{display:flex;align-items:center;gap:1rem;background:var(--bg);border-radius:1rem;padding:0 1rem;margin-bottom:.6rem;font-size:1.5rem;font-weight:500;cursor:pointer;width:100%;min-height:3.5rem}
.big i{font-style:normal;width:2.25rem;height:2.25rem;border-radius:.7rem;border:.2rem solid var(--muted);display:grid;place-items:center;color:#fff;flex:none}
.big.on{color:var(--muted);text-decoration:line-through}.big.on i{background:var(--ok);border-color:var(--ok)}
.pb{display:inline-flex;align-items:center;min-height:3.25rem;background:var(--bg);border-radius:1rem;padding:0 1.1rem;margin:.25rem .4rem .25rem 0;font-size:1.25rem;font-weight:500;cursor:pointer}
.pb.go{background:var(--fg);color:var(--bg);font-weight:700}
.pb.x{color:var(--muted)}
#sbox input,#sbox select{font-family:inherit;font-size:1.25rem;width:100%;min-height:3.25rem;padding:0 1rem;border-radius:1rem;border:.125rem solid var(--soft);background:var(--bg);color:var(--fg);margin:.2rem 0;-webkit-user-select:text;user-select:text}
.prow{display:flex;flex-wrap:wrap;gap:.4rem;align-items:center;background:var(--bg);border-radius:1rem;padding:.6rem;margin-bottom:.5rem}
.prow input{flex:1 1 8rem;width:auto;background:var(--card)}
.dots{display:flex;gap:.5rem;align-items:center}
.dot{width:2.5rem;height:2.5rem;border-radius:50%;background:var(--c);border:.2rem solid transparent}
/* settings popup: compact, with a fixed header (X) and a fixed footer (done) */
#sbox.set{display:flex;flex-direction:column;padding:0;overflow:hidden;width:min(34rem,100%);max-height:min(100%,46rem)}
#sbox.set .shead{display:flex;align-items:center;gap:.5rem;padding:.9rem .9rem .3rem 1.2rem;flex:none}
#sbox.set .shead h3{margin:0;font-size:1.5rem;flex:1}
#sbox.set .sbody{flex:1;min-height:0;overflow:auto;padding:0 1.2rem .4rem}
#sbox.set .sfoot{flex:none;padding:.6rem 1.2rem .9rem;border-top:1px solid var(--soft)}
#sbox.set .sfoot .pb{width:100%;justify-content:center;margin:0}
#sbox.set .sub{font-size:1rem;margin:0 0 .3rem}
#sbox.set .sec{font-size:1.05rem;margin:.55rem 0 .2rem}
#sbox.set .note{font-size:1rem}
#sbox.set input,#sbox.set select{font-size:1.05rem;min-height:2.9rem;margin:.1rem 0;border-radius:.8rem}
#sbox.set .pb{min-height:2.9rem;font-size:1.05rem;margin:.15rem .3rem .15rem 0}
#sbox.set .prow{padding:.45rem;margin-bottom:.35rem;gap:.3rem}
#sbox.set .prow input{flex:1 1 40%}
#sbox.set .dot{width:2.6rem;height:2.6rem}
.prow2{flex:1 1 100%;display:flex;align-items:center;justify-content:space-between;gap:.5rem}
.xbtn{width:3rem;height:3rem;border-radius:1rem;background:var(--bg);display:grid;place-items:center;font-size:1.5rem;flex:none}
#sbox.set .pinput{font-size:1.8rem;letter-spacing:.35em;text-align:center;min-height:3.4rem}
#sbox.set .pinput::placeholder{font-size:1.05rem;letter-spacing:0}
.pmsg{min-height:1.5rem;color:var(--err);font-size:1rem;margin-top:.3rem}
.rcode{font-weight:700;font-size:1.8rem;letter-spacing:.06em;text-align:center;background:var(--bg);border-radius:1rem;padding:.9rem .4rem;margin:.6rem 0;-webkit-user-select:all;user-select:all}
.crow{display:flex;align-items:center;gap:.6rem}
.crow span{flex:none;min-width:4.6rem;max-width:7rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:1rem;font-weight:700}
.crow select{flex:1;width:auto;min-width:0}
.dot.on{border-color:var(--fg)}
.cele{text-align:center}.cele .big-cat{width:11rem;height:11rem;margin:0 auto}
.cele h3{font-size:2rem}
.pbar{height:.9rem;background:var(--soft);border-radius:1rem;overflow:hidden;margin:.4rem 0}
.pbar span{display:block;height:100%;border-radius:1rem;background:var(--c)}
.stamps{display:flex;flex-wrap:wrap;gap:.4rem;margin:.5rem 0 1rem}
.sd{width:2.6rem;height:2.6rem;border-radius:.8rem;background:var(--bg);display:grid;place-items:center;font-size:1.125rem;color:var(--muted)}
.sd.on{background:var(--c);color:var(--cf)}.sd.today{outline:.15rem solid var(--now)}
.catx,.big-cat{display:block}
@media (prefers-reduced-motion:no-preference){.cele .big-cat{animation:pop .6s ease-out}.chipx,.b{transition:background .2s}}
@keyframes pop{0%{transform:scale(.4) rotate(-10deg)}70%{transform:scale(1.1)}100%{transform:scale(1)}}

/* phone: one child, three screens (now / today / cat) with a bottom bar */
@media (max-width:700px){
  html{font-size:clamp(14px,4.3vw,18px)}
  body{overflow:auto;height:auto;min-height:100%}
  #app{height:auto;min-height:100%;padding-block:.75rem;padding-bottom:calc(5.5rem + env(safe-area-inset-bottom,0px));gap:.7rem}
  #top{flex-wrap:nowrap;gap:.6rem;min-height:3.5rem}
  #tm{display:block;flex:1;min-width:0}
  #clock{font-family:var(--font-b);font-weight:700;font-size:2.2rem}
  #clock small{font-size:1.1rem;font-weight:500}
  .qt .q{font-family:var(--font-b);font-weight:700;font-size:1.3rem}
  #date{font-size:1.05rem;white-space:normal}
  #who{margin-left:0;flex:none;flex-wrap:nowrap}
  #tabs{display:none}
  #main{flex-direction:column;flex:none;gap:.8rem}
  .chipk{height:3rem}
  .gear{width:3rem;height:3rem}
  .chipx{padding:.45rem .8rem .45rem .55rem;font-size:1.1rem}
  .chipx i{width:1.7rem;height:1.7rem}
  #bar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--card);border-top:1px solid var(--soft);height:calc(4.5rem + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px)}
  #bar button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.1rem;font-size:1rem;color:var(--muted);text-align:center}
  #bar button .ic{width:3.6rem;height:2.2rem;padding:.3rem 1.05rem;border-radius:1.1rem;stroke-width:2}
  #bar button.on{color:var(--ci);font-weight:700}
  #bar button.on .ic{background:var(--cs)}
  .sh{font-size:1.5rem;font-weight:700;line-height:1.25}
  .sdt{font-size:1.05rem;color:var(--muted);white-space:normal;overflow-wrap:break-word}
  .hero{background:var(--c);color:var(--cf);border-radius:1.5rem;padding:1rem 1.1rem 1.1rem}
  .hero .lbl{font-size:1rem;font-weight:500}
  .hero .htitle{font-size:1.9rem;font-weight:700;line-height:1.2;margin:.15rem 0;overflow-wrap:anywhere}
  .hero .sub2{font-size:1.1rem}
  .pbar2{height:.7rem;border-radius:.35rem;background:rgba(128,128,128,.35);margin:.8rem 0 .45rem;overflow:hidden}
  .pbar2 i{display:block;height:100%;background:var(--cf);border-radius:.35rem}
  .hero .rem{font-size:1.25rem;font-weight:700}
  .todo{display:flex;align-items:center;gap:.8rem;width:100%;background:var(--card);color:var(--fg);border-radius:1rem;min-height:3.5rem;padding:.55rem .9rem;margin-top:.6rem;font-size:1.2rem;font-weight:500;text-align:left}
  .todo.dn{color:var(--muted)}.todo.dn .tt2{text-decoration:line-through}
  .cb{width:1.9rem;height:1.9rem;border-radius:.6rem;border:.16rem solid var(--muted);flex:none;display:grid;place-items:center;color:var(--on-ok);font-size:1.3rem}
  .cb.on{background:var(--ok);border-color:var(--ok)}
  .card{background:var(--card);border-radius:1.2rem;padding:.8rem 1rem}
  .card .cl{font-size:1.05rem;font-weight:700;color:var(--muted)}
  .card .todo{background:var(--bg)}
  .nx{display:flex;align-items:center;gap:.9rem;background:var(--card);border-radius:1.2rem;padding:.85rem 1rem}
  .nxi{width:2.9rem;height:2.9rem;border-radius:.9rem;background:var(--cs);color:var(--ci);display:grid;place-items:center;font-size:1.6rem;flex:none}
  .nx .s{font-size:1.05rem;color:var(--muted)}
  .nx .t{font-size:1.25rem;font-weight:700;line-height:1.25}
  .info{display:flex;flex-direction:column;gap:.7rem}
  .info .wr{font-size:1.15rem}
  .info .wr+.wr{margin-top:.5rem}
  .qt{margin-top:0}
  .ptl{position:relative}
  .plab{position:absolute;left:0;top:0;bottom:0;width:3rem}
  .plab span{position:absolute;right:.35rem;transform:translateY(-50%);font-size:1rem;color:var(--muted)}
  .pin{position:absolute;left:3.2rem;right:0;top:0;bottom:0;background:var(--card);border-radius:1.2rem;overflow:clip}
  .fab{display:flex;position:fixed;right:1rem;bottom:calc(5.5rem + env(safe-area-inset-bottom,0px));height:3.25rem;padding:0 1.3rem;border-radius:1.7rem;background:var(--fg);color:var(--bg);font-size:1.1rem;font-weight:700;align-items:center;z-index:9;box-shadow:0 .2rem .8rem rgba(0,0,0,.25)}
  .catcard{background:var(--card);border-radius:1.5rem;padding:1rem;text-align:center}
  .bigcat{width:11rem;height:11rem;margin:0 auto .3rem;display:block}
  .catcard .pbar{margin:.6rem 1rem}
  .hintrow{text-align:center}
  .hintrow .hint{font-size:1.05rem;color:var(--muted)}
}
</style>

</head>

/* ---------- storage ---------- */
var KEY="familyboard.v1",ST;
function defaults(){return {profiles:[],current:null,checks:{},stamps:{},city:0};}
function load(){try{var o=JSON.parse(localStorage.getItem(KEY)||"null");if(o&&o.profiles)return merge(defaults(),o);}catch(e){}return defaults();}
function merge(a,b){for(var k in b)a[k]=b[k];return a;}
function save(){try{localStorage.setItem(KEY,JSON.stringify(ST));}catch(e){}}
ST=load();
function cur(){for(var i=0;i<ST.profiles.length;i++)if(ST.profiles[i].id===ST.current)return ST.profiles[i];return ST.profiles[0]||null;}
function isOn(date,key){return !!(ST.checks[date]&&ST.checks[date][key]);}
function stampCount(pid){var o=ST.stamps[pid]||{},n=0;for(var d in o)if(o[d])n++;return n;}
function stageOf(n){var s=0;for(var i=0;i<STAGE.length;i++)if(n>=STAGE[i].at)s=i;return s;}
function stamped(pid,date){return !!(ST.stamps[pid]&&ST.stamps[pid][date]);}
function kidKeys(p){var D=dayOf(p),keys=[],i,j;for(i=0;i<D.allday.length;i++)keys.push(p.id+"_"+D.allday[i].id+"_t");for(i=0;i<D.events.length;i++)for(j=0;j<D.events[i].todos.length;j++)keys.push(p.id+"_"+D.events[i].id+"_"+j);return keys;}
function totals(p,date){var ks=kidKeys(p),c=0;for(var i=0;i<ks.length;i++)if(isOn(date,ks[i]))c++;return {n:ks.length,c:c};}
function toggle(p,date,key){
  var before=stampCount(p.id),cele=null;
  if(!ST.checks[date])ST.checks[date]={};
  ST.checks[date][key]=!isOn(date,key);
  var tt=totals(p,date),has=stamped(p.id,date);
  if(!ST.stamps[p.id])ST.stamps[p.id]={};
  if(tt.n&&tt.c===tt.n&&!has){ST.stamps[p.id][date]=true;cele={from:stageOf(before),to:stageOf(before+1)};}
  else if(tt.c<tt.n&&has)ST.stamps[p.id][date]=false;
  save();return cele;
}

var CITIES=[["서울",37.5665,126.978],["인천",37.4563,126.7052],["수원",37.2636,127.0286],["성남",37.4201,127.1262],["대전",36.3504,127.3845],["세종",36.48,127.289],["대구",35.8714,128.6014],["울산",35.5384,129.3114],["부산",35.1796,129.0756],["광주",35.1595,126.8526],["제주",33.4996,126.5312]];
var W=null,WFAIL=false,WKEY="familyboard.weather.v1";
try{W=JSON.parse(localStorage.getItem(WKEY)||"null");}catch(e){W=null;}
function wInfo(c){
  if(c===0||c===1)return["sun","맑음"];if(c===2)return["cloud","구름 조금"];if(c===3)return["cloud","흐림"];
  if(c===45||c===48)return["cloud","안개"];if(c>=51&&c<=57)return["rain","이슬비"];if(c>=61&&c<=67)return["rain","비"];
  if((c>=71&&c<=77)||c===85||c===86)return["snow","눈"];if(c>=80&&c<=82)return["rain","소나기"];if(c>=95)return["rain","천둥번개"];
  return["cloud",""];
}
function wetDay(d){var c=d.code;return d.rain>=50||(c>=51&&c<=67)||(c>=80&&c<=82)||c>=95||(c>=71&&c<=77);}
function loadWeather(){
  var c=CITIES[ST.city]||CITIES[0];
  var url="https://api.open-meteo.com/v1/forecast?latitude="+c[1]+"&longitude="+c[2]+"&current=temperature_2m&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Asia%2FSeoul&forecast_days=2";
  if(!window.fetch)return;
  fetch(url).then(function(r){if(!r.ok)throw new Error("http "+r.status);return r.json();}).then(function(j){
    var d=[0,1].map(function(i){return {code:j.daily.weather_code[i],max:j.daily.temperature_2m_max[i],min:j.daily.temperature_2m_min[i],rain:j.daily.precipitation_probability_max[i]||0};});
    W={city:ST.city,day:j.daily.time[0],updated:Date.now(),temp:j.current.temperature_2m,d:d};WFAIL=false;
    try{localStorage.setItem(WKEY,JSON.stringify(W));}catch(e){}
    render();
  }).catch(function(){WFAIL=true;render();});
}
function weatherRows(now){
  if(!W||W.city!==ST.city)return {rows:[],tag:WFAIL?"날씨를 못 불러왔어요":"날씨 불러오는 중"};
  var hrs=(now-W.updated)/3600000,diff=Math.round((new Date(dkey(now)+"T00:00:00")-new Date(W.day+"T00:00:00"))/86400000);
  if(!(hrs<36)||diff<0||diff>1)return {rows:[],tag:WFAIL?"날씨를 못 불러왔어요":"날씨 불러오는 중"};
  var rows=[];
  W.d.slice(diff).forEach(function(d,i){
    var inf=wInfo(d.code),s=inf[1]+(wetDay(d)?" · 우산 챙기기":(d.rain>=30?" · 비 "+d.rain+"%":""));

/* ---------- parent lock: 4-digit PIN + one-time recovery code (kept only as salted hashes on this device) ---------- */
var pinMode="",pinAfter="none";
function sha(s){
  if(window.crypto&&crypto.subtle&&window.TextEncoder){
    return crypto.subtle.digest("SHA-256",new TextEncoder().encode(s)).then(function(b){return Array.prototype.map.call(new Uint8Array(b),function(x){return ("0"+x.toString(16)).slice(-2);}).join("");});
  }
  var h=5381;for(var i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;
  return Promise.resolve("w"+(h>>>0).toString(16));
}
function rnd(n){var a=new Uint8Array(n);if(window.crypto&&crypto.getRandomValues)crypto.getRandomValues(a);else for(var i=0;i<n;i++)a[i]=Math.floor(Math.random()*256);return a;}
function newSalt(){return Array.prototype.map.call(rnd(8),function(x){return ("0"+x.toString(16)).slice(-2);}).join("");}
var RCH="ABCDEFGHJKMNPQRSTUVWXYZ23456789";
function newRecovery(){var a=rnd(12),s="";for(var i=0;i<12;i++)s+=RCH.charAt(a[i]%RCH.length);return s;}
function fmtRec(s){return s.replace(/(.{4})(?=.)/g,"$1-");}
function normRec(s){return String(s).toUpperCase().replace(/[^A-Z0-9]/g,"");}
function popup(title,body,foot,xact){
  return '<div class="shead"><h3>'+title+'</h3><button class="xbtn" data-act="'+(xact||"close")+'" aria-label="닫기">'+ic("x")+'</button></div><div class="sbody">'+body+'</div>'+(foot?'<div class="sfoot">'+foot+'</div>':'');
}
function showPopup(html){settingsOpen=false;openSheet(html);$("sbox").className="set";}
function focusLater(id){setTimeout(function(){var e=$(id);if(e)e.focus();},60);}
function pmsg(t){var e=$("pinmsg");if(e)e.textContent=t;}
function lockedMsg(){var L=ST.lockout,now=Date.now();return (L&&L.until>now)?"잠시 뒤에 다시 시도해 주세요 ("+Math.ceil((L.until-now)/1000)+"초)":"";}
function failOnce(){
  var n=((ST.lockout&&ST.lockout.n)||0)+1;
  ST.lockout=n>=5?{n:0,until:Date.now()+30000}:{n:n,until:0};save();
  return n>=5?"5번 틀렸어요. 30초 뒤에 다시 해 주세요.":"맞지 않아요. 다시 확인해 주세요 ("+n+"/5)";
}
var BTNW='style="width:100%;justify-content:center"';
function requestSettings(){if(!ST.lock)showPinCreate("settings");else showPinEnter();}
function showPinEnter(){
  pinMode="enter";
  showPopup(popup("부모 확인",'<div class="sub">설정은 부모만 바꿀 수 있어요. 암호 4자리를 입력해 주세요.</div><input id="pin" class="pinput" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" aria-label="부모 암호"><div id="pinmsg" class="pmsg" role="alert"></div>','<button class="pb x" data-act="forgot" '+BTNW+'>암호를 잊었어요</button>'));
  focusLater("pin");
}
function verifyPin(v){
  var m=lockedMsg();if(m){pmsg(m);$("pin").value="";return;}
  sha(ST.lock.salt+"|p|"+v).then(function(h){
    if(h===ST.lock.p){ST.lockout=null;save();openSettings(false);}
    else{pmsg(failOnce());var e=$("pin");if(e)e.value="";}
  });
}
function showPinCreate(after,note){
  pinMode="create";pinAfter=after;
  showPopup(popup("부모 암호 만들기",'<div class="sub">'+(note||"아이가 설정을 바꾸지 못하게, 숫자 4자리 암호를 정해 주세요.")+'</div><input id="pin1" class="pinput" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" placeholder="암호 4자리" aria-label="암호"><input id="pin2" class="pinput" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" placeholder="한 번 더" aria-label="암호 확인"><div id="pinmsg" class="pmsg" role="alert"></div>','<button class="pb go" data-act="pincreate" data-default '+BTNW+'>다음</button>'));
  focusLater("pin1");
}
function setLock(pin){
  var salt=newSalt(),code=newRecovery();
  return Promise.all([sha(salt+"|p|"+pin),sha(salt+"|r|"+code)]).then(function(h){ST.lock={salt:salt,p:h[0],r:h[1]};ST.lockout=null;save();return code;});
}
function showRecovery(code){
  pinMode="";
  showPopup(popup("복구 코드",'<div class="sub">암호를 잊었을 때 이 코드로 새 암호를 정할 수 있어요. <b>지금 한 번만</b> 보여 드려요. 화면을 캡처하거나 종이에 적어 두세요.</div><div class="rcode" id="rcode">'+fmtRec(code)+'</div><button class="pb" data-act="copyrec" data-code="'+code+'">복사하기</button><div id="pinmsg" class="pmsg" role="status"></div>','<button class="pb go" data-act="recdone" '+BTNW+'>적어뒀어요</button>',"recdone"));
}
function showForgot(){
  pinMode="forgot";
  showPopup(popup("암호 복구",'<div class="sub">암호를 만들 때 받은 복구 코드를 입력해 주세요.</div><input id="rec" class="pinput" style="font-size:1.4rem" type="text" maxlength="14" autocomplete="off" autocapitalize="characters" placeholder="XXXX-XXXX-XXXX" aria-label="복구 코드"><div id="pinmsg" class="pmsg" role="alert"></div>','<button class="pb go" data-act="recverify" data-default '+BTNW+'>확인</button><button class="pb x" data-act="wipe" '+BTNW+'>복구 코드도 없어요</button>'));
  focusLater("rec");
}
function wipeAll(){
  [KEY,GKEY,EVKEY,WKEY].forEach(function(k){try{localStorage.removeItem(k);}catch(e){}});
  location.reload();
}

/* ---------- events ---------- */
document.addEventListener("input",function(e){
  var t=e.target;
  if(t.id==="pin"&&pinMode==="enter"&&t.value.length===4){verifyPin(t.value);return;}
  if(!t.getAttribute||!t.getAttribute("data-f"))return;
  var f=t.getAttribute("data-f");
  if(f==="city"||f==="cal"){return;}
  var id=t.getAttribute("data-id");
  for(var i=0;i<ST.profiles.length;i++)if(ST.profiles[i].id===id){ST.profiles[i][f]=t.value;}
  save();render();
});
document.addEventListener("change",function(e){
  var t=e.target,f=t.getAttribute&&t.getAttribute("data-f");
  if(f==="city"){ST.city=+t.value;save();W=null;WFAIL=false;loadWeather();render();}
  else if(f==="cal"){
    var pid=t.getAttribute("data-id");
    for(var i=0;i<ST.profiles.length;i++)if(ST.profiles[i].id===pid){
      var cal=null;if(t.value&&G.cals)for(var k=0;k<G.cals.length;k++)if(G.cals[k].id===t.value)cal={id:G.cals[k].id,name:G.cals[k].name};
      ST.profiles[i].cal=cal;delete EV[pid];}
    save();userMoved=false;render();refreshEvents();
  }
});
document.addEventListener("click",function(e){
  var el=e.target;while(el&&el!==document&&!(el.getAttribute&&el.getAttribute("data-act")))el=el.parentNode;
  if(!el||el===document){if(e.target===$("sheet")&&!settingsOpen)closeSheet();return;}
  var a=el.getAttribute("data-act"),date=dkey(new Date()),p=cur();
  if(a==="gonow"){if(isPhone())scrollTodayToNow(true);else scrollNow(true);}
  else if(a==="tab"){TAB=el.getAttribute("data-t");needScroll=(TAB==="today");render();if(TAB!=="today")window.scrollTo(0,0);}
  else if(a==="whoami"){openSheet(sheetWho());}
  else if(a==="jump"){jumpTo(+el.getAttribute("data-h"));}
  else if(a==="pick"){ST.current=el.getAttribute("data-id");save();userMoved=false;needScroll=true;closeSheet();render();}
  else if(a==="tick"){
    e.stopPropagation();var cele=toggle(p,date,el.getAttribute("data-key"));render();
    if(cele)openSheet(sheetCele(cele,p));
    else{var sh=el.getAttribute("data-sheet");if(sh&&$("sheet").classList.contains("show"))$("sbox").innerHTML=sheetBlock(sh);}
  }
  else if(a==="open"){openSheet(sheetBlock(el.getAttribute("data-e")));}
  else if(a==="cat"){openSheet(sheetCat());}
  else if(a==="quote"){openSheet(sheetQuote());}
  else if(a==="close"){closeSheet();}
  else if(a==="settings"){requestSettings();}
  else if(a==="forgot"){showForgot();}
  else if(a==="pincreate"){
    var p1=$("pin1").value,p2v=$("pin2").value;
    if(!/^\d{4}$/.test(p1)){pmsg("숫자 4자리를 입력해 주세요.");}
    else if(p1!==p2v){pmsg("두 암호가 달라요. 다시 확인해 주세요.");}
    else setLock(p1).then(showRecovery);
  }
  else if(a==="recverify"){
    var lm=lockedMsg();
    if(lm)pmsg(lm);
    else sha(ST.lock.salt+"|r|"+normRec($("rec").value)).then(function(h){
      if(h===ST.lock.r){ST.lockout=null;save();showPinCreate("settings","복구 코드를 확인했어요. 새 암호를 정해 주세요.");}
      else pmsg(failOnce());
    });
  }
  else if(a==="wipe"){if(confirm("복구 코드가 없으면 앱을 처음부터 다시 설정해야 해요.\n아이 정보, 도장 기록, 구글 연결이 모두 지워져요. 계속할까요?"))wipeAll();}
  else if(a==="copyrec"){
    var cd=el.getAttribute("data-code");
    try{navigator.clipboard.writeText(fmtRec(cd)).then(function(){pmsg("복사했어요");},function(){pmsg("복사하지 못했어요. 직접 적어 두세요.");});}catch(er){pmsg("복사하지 못했어요. 직접 적어 두세요.");}
  }
  else if(a==="recdone"){if(pinAfter==="settings"){pinAfter="none";openSettings(false);}else closeSheet();}
  else if(a==="gconnect"||a==="greauth"){if(!gRequest(true))alert("구글 로그인을 준비하는 중이에요. 잠시 뒤 다시 눌러 주세요.");}
  else if(a==="gdisc"){if(confirm("구글 캘린더 연결을 끊고 샘플 일정으로 돌아갈까요?")){gDisconnect();render();if(settingsOpen)$("sbox").innerHTML=sheetSettings(false);}}
  else if(a==="closeset"){finishSettings();}
  else if(a==="color"){var pid=el.getAttribute("data-id");for(var i=0;i<ST.profiles.length;i++)if(ST.profiles[i].id===pid)ST.profiles[i].color=el.getAttribute("data-c");save();render();$("sbox").innerHTML=sheetSettings(false);}
  else if(a==="addp"){var np={id:uid(),name:"",grade:"",color:COLORS[ST.profiles.length%COLORS.length].id};ST.profiles.push(np);save();$("sbox").innerHTML=sheetSettings(false);}
  else if(a==="delp"){var did=el.getAttribute("data-id");if(ST.profiles.length>1&&confirm("이 아이를 지울까요?")){ST.profiles=ST.profiles.filter(function(q){return q.id!==did;});if(ST.current===did)ST.current=ST.profiles[0].id;save();render();$("sbox").innerHTML=sheetSettings(false);}}
  else if(a==="reset"){if(confirm("도장과 체크 기록을 모두 지울까요?")){ST.checks={};ST.stamps={};save();render();}}
});

document.addEventListener("keydown",function(e){
  if(e.key==="Escape"&&$("sheet").classList.contains("show")){if(settingsOpen)finishSettings();else closeSheet();}
  if(e.key==="Enter"&&e.target&&(e.target.id==="pin1"||e.target.id==="pin2"||e.target.id==="rec")){var b=document.querySelector("#sbox [data-default]");if(b)b.click();}
});

/* ---------- start ---------- */
if(!ST.profiles.length){ST.profiles=[{id:uid(),name:"",grade:"",color:"blue"}];ST.current=ST.profiles[0].id;save();render();openSettings(true);}
if(mq.addEventListener)mq.addEventListener("change",function(){needScroll=true;render();});else if(mq.addListener)mq.addListener(function(){needScroll=true;render();});
tick();setInterval(tick,1000);
gInit();setInterval(refreshEvents,300000);
document.addEventListener("visibilitychange",function(){if(!document.hidden)refreshEvents();});
window.addEventListener("resize",function(){fitBlocks();if(!userMoved)scrollNow(false);});
requestAnimationFrame(function(){if(!userMoved)scrollNow(false);});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(function(){fitBlocks();if(!userMoved)scrollNow(false);});
})();
</script>
</body>
</html>
