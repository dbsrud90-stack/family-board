<style>
/* One child at a time. Tablet/landscape: planner + side column. Phone/portrait: planner, then info cards below.
   1rem = 16px at 1024x768; phone uses a clamp. */
:root{
  color-scheme:light dark;
  --bg:#faf6ef;--fg:#2a2420;--muted:#6f655b;--card:#ffffff;--soft:#f0e9de;--chip:#ffffff;
  --ok:#2e9e6b;--now:#e5484d;
  --font-n:"Jua","Noto Sans KR",sans-serif;
  --font-b:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
.pal-blue{--c:#2e6be6;--cs:#e3edff;--ci:#14316b;--cf:#ffffff}
.pal-yellow{--c:#ffc02e;--cs:#fff0c7;--ci:#4a3200;--cf:#4a3200}
.pal-pink{--c:#e5568c;--cs:#ffe1ec;--ci:#6b1236;--cf:#ffffff}
.pal-green{--c:#2e9e6b;--cs:#dcf5e8;--ci:#0f4a2e;--cf:#ffffff}
@media (prefers-color-scheme: dark){
  :root{--bg:#17130f;--fg:#f4efe7;--muted:#b4a99c;--card:#241e18;--soft:#3a3128;--chip:#17130f;--ok:#3ecf8e;--now:#ff6b6f}
  .pal-blue{--c:#5b8cff;--cs:#1f2f55;--ci:#cfe0ff;--cf:#0e1b3a}
  .pal-yellow{--c:#ffc93c;--cs:#4a3b12;--ci:#ffe9a8;--cf:#3b2900}
  .pal-pink{--c:#ff7fae;--cs:#4d2236;--ci:#ffd3e4;--cf:#3d0f23}
  .pal-green{--c:#3ecf8e;--cs:#17402f;--ci:#c4f2dc;--cf:#08301f}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:min(1.5625vw,2.0833vh);height:100%}
body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font-family:var(--font-b);line-height:1.3;-webkit-user-select:none;user-select:none}
#app{height:100%;display:flex;flex-direction:column;gap:.75rem;padding-block:1.25rem;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font-family:inherit;color:inherit;border:0;background:none;padding:0;text-align:left;cursor:pointer}
.n{font-family:var(--font-n);font-weight:400}
.ic{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* top */
#top{display:flex;align-items:center;gap:1.25rem;flex:none;min-height:4rem;flex-wrap:wrap}
#clock{font-size:3.5rem;line-height:1;white-space:nowrap}
#clock small{font-size:1.5rem;margin-right:.4rem;color:var(--muted)}
#clock .co.off{opacity:.3}
#date{font-size:1.25rem;color:var(--muted);white-space:nowrap}
#who{margin-left:auto;display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.chipk{height:2.75rem;padding:0 1.1rem;border-radius:1rem;background:var(--card);font-size:1.125rem;font-weight:700;display:flex;align-items:center;gap:.5rem}
.chipk.on{background:var(--c);color:var(--cf)}
.gear{width:2.75rem;height:2.75rem;border-radius:1rem;background:var(--card);display:grid;place-items:center;font-size:1.5rem}

/* tabs */
#tabs{display:flex;gap:.5rem;align-items:center;flex:none;flex-wrap:wrap}
.seg{height:2.5rem;padding:0 1.25rem;border-radius:.9rem;background:var(--card);font-size:1.125rem;font-weight:500;display:flex;align-items:center;gap:.5rem}
.seg.on{background:var(--fg);color:var(--bg)}
.seg.live::after{content:"";width:.6rem;height:.6rem;border-radius:50%;background:var(--now)}
#tabs .sp{flex:1}
#tabs .hint{font-size:1.125rem;color:var(--muted)}

/* board */
#main{flex:1;min-height:0;display:flex;gap:1rem}
.board{flex:1;min-width:0;display:flex;gap:1rem}
.axis{width:2.75rem;display:flex;flex-direction:column;flex:none}
.axis .sp{height:7.25rem;flex:none}
.axis .ax{flex:1;position:relative;overflow:hidden;min-height:0}
.axi{position:relative}
.axis .ax span{position:absolute;right:0;transform:translateY(-50%);font-size:1.125rem;color:var(--muted)}
.kcol{flex:1;display:flex;flex-direction:column;min-width:0}
.kh{height:4.5rem;display:flex;align-items:center;gap:.75rem;padding:0 .25rem;width:100%}
.kh .catx{width:3.75rem;height:3.75rem;flex:none;display:block}
.kh .nm{font-size:1.75rem;font-weight:700;line-height:1.1;white-space:nowrap;min-width:0}
.kh .nm small{display:block;font-size:1.125rem;font-weight:400;color:var(--muted)}
.kh .left{margin-left:auto;font-size:1.125rem;font-weight:700;border-radius:.9rem;padding:.4rem .9rem;text-align:center;white-space:nowrap;background:var(--cs);color:var(--ci)}
.kh .left.done{background:var(--ok);color:#fff}
.ad{height:2.75rem;display:flex;align-items:center;gap:.5rem;padding:0 .25rem;overflow:hidden;white-space:nowrap}
.ad .al{font-size:1.125rem;color:var(--muted)}
.tl{position:relative;flex:1;border-radius:1.25rem;background:var(--card);overflow-x:hidden;overflow-y:auto;min-height:0;touch-action:pan-y;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;scrollbar-width:none}
.tl::-webkit-scrollbar{display:none}
.tli{position:relative;width:100%}
.tl .gl{position:absolute;left:0;right:0;border-top:.125rem solid var(--soft)}
.chipx{background:var(--chip);color:var(--fg);border-radius:.75rem;padding:.2rem .75rem .2rem .45rem;font-size:1.125rem;font-weight:500;display:inline-flex;gap:.5rem;align-items:center;cursor:pointer;line-height:1.3}
.chipx i{width:1.4rem;height:1.4rem;border-radius:.45rem;border:.125rem solid var(--muted);display:grid;place-items:center;font-style:normal;color:#fff;font-size:1rem;flex:none}
.chipx.on{text-decoration:line-through;color:var(--muted)}.chipx.on i{background:var(--ok);border-color:var(--ok)}
.b{position:absolute;border-radius:.9rem;padding:.3rem .75rem;overflow:hidden;cursor:pointer;display:block;background:var(--cs);color:var(--ci)}
.b.now{background:var(--c);color:var(--cf);box-shadow:0 .4rem 1rem rgba(0,0,0,.18);z-index:2}
.b.past{opacity:.5}
.b .bt{display:flex;align-items:baseline;gap:.5rem;white-space:nowrap;line-height:1.3}
.b .tt{font-size:1.2rem;font-weight:700}
.b small{font-size:1.125rem;font-weight:400;opacity:.8}
.b .pg{margin-left:auto;font-size:1.125rem;font-weight:700;background:var(--card);color:var(--fg);border-radius:.7rem;padding:0 .5rem;display:none}
.b .pg.ok{background:var(--ok);color:#fff}
.b .tk{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.3rem}
.nowln{position:absolute;left:0;right:0;height:0;border-top:.2rem solid var(--now);z-index:3;pointer-events:none}
.nowln::before{content:"";position:absolute;left:-.05rem;top:-.5rem;width:.8rem;height:.8rem;border-radius:50%;background:var(--now)}

/* side */
.side{width:14.25rem;display:flex;flex-direction:column;gap:1.1rem;padding-top:.25rem;flex:none;overflow:hidden}
.wr{display:flex;align-items:center;gap:.75rem;font-size:1.25rem;font-weight:500;position:relative}
.wr .ic{font-size:2.1rem;flex:none}.wr small{display:block;font-size:1.125rem;color:var(--muted);font-weight:400}
.tag{font-size:1rem;background:var(--soft);color:var(--muted);border-radius:.5rem;padding:0 .4rem;margin-left:auto}
.qt{width:100%;display:flex;flex-direction:column;gap:.25rem;background:var(--soft);border-radius:1rem;padding:.6rem .8rem;margin-top:auto}
.qt .lb{font-size:1.125rem;color:var(--muted);display:flex;gap:.5rem;align-items:center}
.qt .q{font-family:var(--font-n);font-size:1.5rem;line-height:1.3}
.qt .w{font-size:1.125rem;color:var(--muted);text-align:right}

/* sheet */
#sheet{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(30,20,10,.5);z-index:20;padding:1rem}
#sheet.show{display:flex}
#sbox{background:var(--card);border-radius:1.75rem;padding:1.5rem;width:min(40rem,100%);max-height:100%;overflow:auto;-webkit-user-select:text;user-select:text}
#sbox h3{font-size:1.75rem;margin:0 0 .25rem;font-weight:700}
#sbox .sub{color:var(--muted);font-size:1.125rem;margin:0 0 .75rem}
#sbox .sec{font-size:1.125rem;font-weight:700;margin:1rem 0 .4rem}
#sbox .note{color:var(--muted);font-size:1.125rem}
.big{display:flex;align-items:center;gap:1rem;background:var(--bg);border-radius:1rem;padding:0 1rem;margin-bottom:.6rem;font-size:1.5rem;font-weight:500;cursor:pointer;width:100%;min-height:3.5rem}
.big i{font-style:normal;width:2.25rem;height:2.25rem;border-radius:.7rem;border:.2rem solid var(--muted);display:grid;place-items:center;color:#fff;flex:none}
.big.on{color:var(--muted);text-decoration:line-through}.big.on i{background:var(--ok);border-color:var(--ok)}
.pb{display:inline-flex;align-items:center;min-height:3.25rem;background:var(--bg);border-radius:1rem;padding:0 1.1rem;margin:.25rem .4rem .25rem 0;font-size:1.25rem;font-weight:500;cursor:pointer}
.pb.go{background:var(--fg);color:var(--bg);font-weight:700}
.pb.x{color:var(--muted)}
#sbox input,#sbox select{font-family:inherit;font-size:1.25rem;width:100%;min-height:3.25rem;padding:0 1rem;border-radius:1rem;border:.125rem solid var(--soft);background:var(--bg);color:var(--fg);margin:.2rem 0;-webkit-user-select:text;user-select:text}
.prow{display:flex;flex-wrap:wrap;gap:.4rem;align-items:center;background:var(--bg);border-radius:1rem;padding:.6rem;margin-bottom:.5rem}
.prow input{flex:1 1 8rem;width:auto;background:var(--card)}
.dots{display:flex;gap:.5rem;align-items:center}
.dot{width:2.5rem;height:2.5rem;border-radius:50%;background:var(--c);border:.2rem solid transparent}
.dot.on{border-color:var(--fg)}
.cele{text-align:center}.cele .big-cat{width:11rem;height:11rem;margin:0 auto}
.cele h3{font-size:2rem}
.pbar{height:.9rem;background:var(--soft);border-radius:1rem;overflow:hidden;margin:.4rem 0}
.pbar span{display:block;height:100%;border-radius:1rem;background:var(--c)}
.stamps{display:flex;flex-wrap:wrap;gap:.4rem;margin:.5rem 0 1rem}
.sd{width:2.6rem;height:2.6rem;border-radius:.8rem;background:var(--bg);display:grid;place-items:center;font-size:1.125rem;color:var(--muted)}
.sd.on{background:var(--c);color:var(--cf)}.sd.today{outline:.15rem solid var(--now)}
.catx,.big-cat{display:block}
@media (prefers-reduced-motion:no-preference){.cele .big-cat{animation:pop .6s ease-out}.chipx,.b{transition:background .2s}}
@keyframes pop{0%{transform:scale(.4) rotate(-10deg)}70%{transform:scale(1.1)}100%{transform:scale(1)}}

/* phone / portrait */
@media (max-width:700px){
  html{font-size:clamp(14px,4.3vw,18px)}
  body{overflow:auto;height:auto;min-height:100%}
  #app{height:auto;min-height:100%;padding-block:.75rem}
  #top{gap:.4rem .9rem}
  #clock{font-size:2.75rem}
  #main{flex-direction:column;flex:none}
  .board{flex:none;height:max(32rem,64vh)}
  .axis{width:2.5rem}
  .side{width:100%;flex-direction:row;flex-wrap:wrap;gap:.75rem}
  .side>*{flex:1 1 12rem}
  .qt{margin-top:0}
}
</style>

var PPH=7,DAY={s:5.5,e:22},scrollT=null,progScroll=false,userMoved=false;
function rootPx(){return parseFloat(getComputedStyle(document.documentElement).fontSize)||16;}
function nowTop(){var n=new Date(),m=n.getHours()*60+n.getMinutes();return Math.max(0,((m/60-DAY.s)-0.75)*PPH*rootPx());}
function markTabs(){
  var t=document.querySelector(".tl");if(!t)return;
  var h=DAY.s+t.scrollTop/(PPH*rootPx())+0.3,id=h<12?"am":h<18?"pm":"ev";
  if(t.scrollHeight>t.clientHeight&&t.scrollTop+t.clientHeight>=t.scrollHeight-2)id="ev";
  var b=document.querySelectorAll("[data-act=jump]");
  for(var i=0;i<b.length;i++)b[i].classList.toggle("on",b[i].getAttribute("data-id")===id);
}
function setScroll(y){var t=document.querySelector(".tl"),ax=document.querySelector(".ax");if(t)t.scrollTop=y;if(ax)ax.scrollTop=y;}
function scrollNow(smooth){
  var t=document.querySelector(".tl");if(!t)return;
  progScroll=true;if(smooth)userMoved=false;var y=nowTop();
  try{t.scrollTo({top:y,behavior:smooth?"smooth":"auto"});}catch(e){t.scrollTop=y;}
  if(!smooth)setScroll(y);
  setTimeout(function(){progScroll=false;markTabs();},smooth?900:150);
}
function jumpTo(hr){
  var t=document.querySelector(".tl");if(!t)return;
  var y=Math.max(0,(hr-DAY.s-0.25)*PPH*rootPx());
  progScroll=true;userMoved=true;
  try{t.scrollTo({top:y,behavior:"smooth"});}catch(e){t.scrollTop=y;}
  clearTimeout(scrollT);scrollT=setTimeout(function(){scrollNow(true);},120000);
  setTimeout(function(){progScroll=false;markTabs();},900);
}
function bindScroll(){
  var t=document.querySelector(".tl");if(!t)return;
  t.addEventListener("scroll",function(){
    var ax=document.querySelector(".ax");if(ax)ax.scrollTop=t.scrollTop;
    markTabs();
    if(!progScroll){userMoved=true;clearTimeout(scrollT);scrollT=setTimeout(function(){scrollNow(true);},120000);}
  },{passive:true});
}
function layout(evs){
  var s=evs.slice().sort(function(a,b){return a.start-b.start||a.end-b.end;}),cl=[],cu=null,end=-1;
  s.forEach(function(e){if(!cu||e.start>=end){cu=[];cl.push(cu);end=e.end;}else end=Math.max(end,e.end);cu.push(e);});
  cl.forEach(function(c){var lanes=[];c.forEach(function(e){var l=0;while(lanes[l]!==undefined&&lanes[l]>e.start)l++;lanes[l]=e.end;e.lane=l;});c.forEach(function(e){e.lanes=lanes.length;});});
  return s;
}
function chipHtml(key,label,on){return '<span class="chipx'+(on?" on":"")+'" data-act="tick" data-key="'+esc(key)+'"><i>'+(on?ic("check"):"")+'</i>'+esc(label)+'</span>';}
function boardHtml(p,now){
  var date=dkey(now),nowMin=now.getHours()*60+now.getMinutes(),S0=DAY.s*60,E0=DAY.e*60,nh=DAY.e-DAY.s,D=dayOf(p),ev=layout(D.events);
  var tt=totals(p,date),sg=stageOf(stampCount(p.id)),ex=stamped(p.id,date)?"happy":"normal";
  var left=!tt.n?"":(tt.c===tt.n?'<span class="left done">오늘 도장 완료</span>':'<span class="left">'+(tt.n-tt.c)+'개 남았어요</span>');
  var h='<div class="axis"><div class="sp"></div><div class="ax"><div class="axi" style="height:'+(nh*PPH)+'rem">';
  for(var hh=Math.ceil(DAY.s);hh<DAY.e;hh++)h+='<span style="top:'+((hh-DAY.s)/nh*100)+'%">'+(hh%12||12)+'시</span>';
  h+='</div></div></div>';
  h+='<div class="kcol"><button class="kh" data-act="cat"><span class="catx">'+catSVG(p.color,sg,ex)+'</span><span class="nm">'+esc(p.name||"우리 아이")+'<small>'+esc(p.grade||"")+'</small></span>'+left+'</button>';
  h+='<div class="ad"><span class="al">오늘 할 일</span>';
  if(!D.allday.length)h+='<span class="al">없어요</span>';
  for(var a=0;a<D.allday.length;a++){var ak=p.id+"_"+D.allday[a].id+"_t";h+=chipHtml(ak,D.allday[a].title,isOn(date,ak));}
  h+='</div><div class="tl"><div class="tli" style="height:'+(nh*PPH)+'rem">';
  for(var g=Math.ceil(DAY.s);g<DAY.e;g++)h+='<div class="gl" style="top:'+((g-DAY.s)/nh*100)+'%"></div>';
  for(var i=0;i<ev.length;i++){
    var E=ev[i],s0=E.start,e0=E.end;if(e0<=S0||s0>=E0)continue;
    var cs=Math.max(s0,S0),ce=Math.min(e0,E0),top=(cs-S0)/(E0-S0)*100,hgt=(ce-cs)/(E0-S0)*100;
    var n=E.todos.length,c=0;for(var j=0;j<n;j++)if(isOn(date,p.id+"_"+E.id+"_"+j))c++;
    var cu=nowMin>=s0&&nowMin<e0,past=e0<=nowMin,ln=E.lanes||1,lf=(E.lane||0)*100/ln;
    h+='<div class="b'+(cu?" now":"")+(past?" past":"")+'" data-act="open" data-e="'+esc(E.id)+'" style="top:calc('+top+'% + .125rem);height:calc('+hgt+'% - .25rem);left:calc('+lf+'% + .5rem);width:calc('+(100/ln)+'% - 1rem)">'+
      '<div class="bt"><span class="tt">'+esc(E.title)+'</span><small>'+fmtS(s0)+'</small>'+(n?'<span class="pg'+(c===n?" ok":"")+'">'+c+'/'+n+'</span>':'')+'</div>';
    if(n){h+='<div class="tk">';for(j=0;j<n;j++)h+=chipHtml(p.id+"_"+E.id+"_"+j,E.todos[j].t,isOn(date,p.id+"_"+E.id+"_"+j));h+='</div>';}
    h+='</div>';
  }
  if(nowMin>=S0&&nowMin<E0)h+='<div class="nowln" style="top:'+((nowMin-S0)/(E0-S0)*100)+'%"></div>';
  return h+'</div></div></div>';
}
function sideHtml(now){
  var wv=weatherRows(now),h='<div class="side">';
  if(!wv.rows.length)h+='<div class="wr"><div>날씨<small>'+esc(wv.tag)+'</small></div></div>';
  for(var i=0;i<wv.rows.length;i++){var w=wv.rows[i];h+='<div class="wr">'+ic(w.i)+'<div>'+w.l+" "+w.t+'<small>'+esc(w.s)+'</small></div>'+(i===0?'<span class="tag">'+esc(wv.tag)+'</span>':"")+'</div>';}
  var q=quoteOfDay(now);
  h+='<button class="qt" data-act="quote"><span class="lb">'+ic("star")+'오늘의 명언</span><span class="q">'+q.t.split("\n").map(esc).join("<br>")+'</span><span class="w">— '+esc(q.a)+'</span></button>';
  return h+'</div>';
}
function fitBlocks(){
  var root=rootPx(),bl=document.querySelectorAll(".b");
  for(var i=0;i<bl.length;i++){var b=bl[i],tk=b.querySelector(".tk"),pg=b.querySelector(".pg");if(!tk)continue;
    var fits=b.clientHeight>=4.4*root;tk.style.display=fits?"flex":"none";if(pg)pg.style.display=fits?"none":"inline-block";
    if(fits&&b.scrollHeight>b.clientHeight+2){tk.style.display="none";if(pg)pg.style.display="inline-block";}}
}

/* ---------- render ---------- */
function render(){
  var now=new Date(),p=cur();if(!p)return;
  $("app").className="pal-"+p.color;
  var old=document.querySelector(".tl"),keep=old?old.scrollTop:null;
  var w="";
  if(ST.profiles.length>1)for(var i=0;i<ST.profiles.length;i++){var q=ST.profiles[i];w+='<button class="chipk pal-'+q.color+(q.id===p.id?" on":"")+'" data-act="pick" data-id="'+esc(q.id)+'">'+esc(q.name||"우리 아이")+'</button>';}
  w+='<button class="gear" data-act="settings" aria-label="설정">'+ic("gear")+'</button>';
  $("who").innerHTML=w;
  $("tabs").innerHTML='<button class="seg" data-act="jump" data-h="6" data-id="am">오전</button><button class="seg" data-act="jump" data-h="12" data-id="pm">오후</button><button class="seg" data-act="jump" data-h="18" data-id="ev">저녁</button><button class="seg live" data-act="gonow">지금으로</button><span class="sp"></span>'+calHint();
  $("main").innerHTML='<div class="board">'+boardHtml(p,now)+'</div>'+sideHtml(now);
  bindScroll();
  if(!userMoved||keep===null)scrollNow(false);else{progScroll=true;setScroll(keep);setTimeout(function(){progScroll=false;},150);}
  markTabs();fitBlocks();
}
var lastMin=-1,lastDay="";
function tick(){
  var n=new Date(),h=n.getHours(),m=n.getMinutes(),s=n.getSeconds(),h12=h%12||12;
  $("clock").innerHTML='<small>'+(h<12?"오전":"오후")+'</small>'+h12+'<span class="co'+(s%2?" off":"")+'">:</span>'+p2(m);
  if(m!==lastMin){lastMin=m;
    $("date").textContent=(n.getMonth()+1)+"월 "+n.getDate()+"일 "+DOW[n.getDay()]+"요일";
    if(dkey(n)!==lastDay){lastDay=dkey(n);loadWeather();}
    render();}
}

/* ---------- sheets ---------- */
function openSheet(h){$("sbox").innerHTML=h;$("sheet").classList.add("show");}
function closeSheet(){$("sheet").classList.remove("show");}
var settingsOpen=false;
function sheetBlock(eid){
  var p=cur(),D=dayOf(p),e=null,date=dkey(new Date());
  for(var q=0;q<D.events.length;q++)if(D.events[q].id===eid)e=D.events[q];
  if(!e)return '<h3>일정을 찾지 못했어요</h3><div><button class="pb x" data-act="close">닫기</button></div>';
  var h='<h3>'+esc(e.title)+'</h3><div class="sub">'+fmt(e.start)+" ~ "+fmt(e.end>=1440?1439:e.end)+'</div>';
  if(!e.todos.length)h+='<div class="sub">이 시간에는 따로 할 일이 없어요.</div>';
  for(var j=0;j<e.todos.length;j++){var key=p.id+"_"+eid+"_"+j,on=isOn(date,key);h+='<button class="big'+(on?" on":"")+'" data-act="tick" data-key="'+esc(key)+'" data-sheet="'+esc(eid)+'"><i>'+(on?ic("check"):"")+'</i>'+esc(e.todos[j].t)+'</button>';}
  return h+'<div><button class="pb x" data-act="close">닫기</button></div>';
}
function sheetCele(c,p){
  var up=c.to>c.from;
  return '<div class="cele pal-'+p.color+'"><div class="big-cat">'+catSVG(p.color,c.to,"happy")+'</div><h3>'+(up?(c.to===1?"알에서 깨어났어요!":"고양이가 자랐어요!"):"오늘 도장 쾅!")+'</h3><div class="sub">'+esc(p.name)+'의 '+STAGE[c.to].n+(up?'':' · 할 일을 모두 끝냈어요')+'</div><button class="pb go" data-act="close">야호!</button></div>';
}
function sheetCat(){
  var p=cur(),n=stampCount(p.id),sg=stageOf(n),now=new Date(),date=dkey(now);
  var h='<div class="cele pal-'+p.color+'"><div class="big-cat">'+catSVG(p.color,sg,stamped(p.id,date)?"happy":"normal")+'</div><h3>'+esc(p.name)+'의 '+STAGE[sg].n+'</h3><div class="sub">도장 '+n+'개</div>';
  if(sg<STAGE.length-1){var a=STAGE[sg].at,b=STAGE[sg+1].at;h+='<div class="sub">다음 모습 「'+STAGE[sg+1].n+'」까지 '+(b-n)+'개</div><div class="pbar"><span style="width:'+Math.round((n-a)/(b-a)*100)+'%"></span></div>';}
  else h+='<div class="sub">가장 멋진 모습이에요!</div>';
  h+='</div><div class="sub">이번 달 도장</div><div class="stamps pal-'+p.color+'">';
  var dim=new Date(now.getFullYear(),now.getMonth()+1,0).getDate(),st=ST.stamps[p.id]||{};
  for(var d=1;d<=dim;d++){var key=now.getFullYear()+"-"+p2(now.getMonth()+1)+"-"+p2(d),on=!!st[key];h+='<span class="sd'+(on?" on":"")+(d===now.getDate()?" today":"")+'">'+(on?ic("check"):d)+'</span>';}
  return h+'</div><div style="text-align:center"><button class="pb x" data-act="close">닫기</button></div>';
}
function sheetQuote(){
  var q=quoteOfDay(new Date());
  return '<h3>오늘의 명언</h3><div style="font-family:var(--font-n);font-size:2.25rem;line-height:1.35;margin:.6rem 0">'+q.t.split("\n").map(esc).join("<br>")+'</div><div class="sub">— '+esc(q.a)+'</div><div style="font-size:1.4rem;font-weight:500;background:var(--bg);border-radius:1rem;padding:.75rem 1rem;margin:.5rem 0 1rem">'+esc(q.m)+'</div><div><button class="pb x" data-act="close">닫기</button></div>';
}
function sheetSettings(setup){
  var h='<h3>'+(setup?"처음 설정":"설정")+'</h3>';
  h+='<div class="sub">'+(setup?"이 기기에서 볼 아이를 알려주세요. 패드라면 아이를 더 추가할 수 있어요.":"아이 정보와 색을 바꿀 수 있어요.")+'</div>';
  h+='<div class="sec">아이</div>';
  ST.profiles.forEach(function(p){
    h+='<div class="prow"><input data-f="name" data-id="'+esc(p.id)+'" value="'+esc(p.name)+'" placeholder="이름" maxlength="10"><input data-f="grade" data-id="'+esc(p.id)+'" value="'+esc(p.grade)+'" placeholder="학년 (예: 2학년)" maxlength="8"><div class="dots">';
    COLORS.forEach(function(c){h+='<button class="dot pal-'+c.id+(p.color===c.id?" on":"")+'" data-act="color" data-id="'+esc(p.id)+'" data-c="'+c.id+'" aria-label="'+c.l+'"></button>';});
    h+='</div>'+(ST.profiles.length>1?'<button class="pb x" data-act="delp" data-id="'+esc(p.id)+'">삭제</button>':'')+'</div>';
  });
  h+='<button class="pb" data-act="addp">+ 아이 추가</button>';
  h+=calSection();
  h+='<div class="sec">날씨 도시</div><select data-f="city">';
  CITIES.forEach(function(c,i){h+='<option value="'+i+'"'+(ST.city===i?" selected":"")+'>'+c[0]+'</option>';});
  h+='</select><div class="sec">기록</div><button class="pb x" data-act="reset">도장·체크 기록 지우기</button>';
  return h+'<div style="margin-top:.5rem"><button class="pb go" data-act="closeset">완료</button></div>';
}
function openSettings(setup){settingsOpen=true;openSheet(sheetSettings(setup));}
function finishSettings(){
  ST.profiles.forEach(function(p){if(!p.name)p.name="우리 아이";});
  if(!cur())ST.current=ST.profiles[0].id;
  save();settingsOpen=false;closeSheet();userMoved=false;render();
}

/* ---------- events ---------- */
document.addEventListener("input",function(e){
  var t=e.target;if(!t.getAttribute||!t.getAttribute("data-f"))return;
  var f=t.getAttribute("data-f");
  if(f==="city"||f==="cal"){return;}
  var id=t.getAttribute("data-id");
  for(var i=0;i<ST.profiles.length;i++)if(ST.profiles[i].id===id){ST.profiles[i][f]=t.value;}
  save();render();
});
document.addEventListener("change",function(e){
  var t=e.target,f=t.getAttribute&&t.getAttribute("data-f");
  if(f==="city"){ST.city=+t.value;save();W=null;WFAIL=false;loadWeather();render();}
  else if(f==="cal"){
    var pid=t.getAttribute("data-id");
    for(var i=0;i<ST.profiles.length;i++)if(ST.profiles[i].id===pid){
      var cal=null;if(t.value&&G.cals)for(var k=0;k<G.cals.length;k++)if(G.cals[k].id===t.value)cal={id:G.cals[k].id,name:G.cals[k].name};
      ST.profiles[i].cal=cal;delete EV[pid];}
    save();userMoved=false;render();refreshEvents();
  }
});
document.addEventListener("click",function(e){
  var el=e.target;while(el&&el!==document&&!(el.getAttribute&&el.getAttribute("data-act")))el=el.parentNode;
  if(!el||el===document){if(e.target===$("sheet")&&!settingsOpen)closeSheet();return;}
  var a=el.getAttribute("data-act"),date=dkey(new Date()),p=cur();
  if(a==="gonow"){scrollNow(true);}
  else if(a==="jump"){jumpTo(+el.getAttribute("data-h"));}
  else if(a==="pick"){ST.current=el.getAttribute("data-id");save();userMoved=false;render();}
  else if(a==="tick"){
    e.stopPropagation();var cele=toggle(p,date,el.getAttribute("data-key"));render();
    if(cele)openSheet(sheetCele(cele,p));
    else{var sh=el.getAttribute("data-sheet");if(sh&&$("sheet").classList.contains("show"))$("sbox").innerHTML=sheetBlock(sh);}
  }
  else if(a==="open"){openSheet(sheetBlock(el.getAttribute("data-e")));}
  else if(a==="cat"){openSheet(sheetCat());}
  else if(a==="quote"){openSheet(sheetQuote());}
  else if(a==="close"){closeSheet();}
  else if(a==="settings"){openSettings(false);}
  else if(a==="gconnect"||a==="greauth"){if(!gRequest(true))alert("구글 로그인을 준비하는 중이에요. 잠시 뒤 다시 눌러 주세요.");}
  else if(a==="gdisc"){if(confirm("구글 캘린더 연결을 끊고 샘플 일정으로 돌아갈까요?")){gDisconnect();render();if(settingsOpen)$("sbox").innerHTML=sheetSettings(false);}}
  else if(a==="closeset"){finishSettings();}
  else if(a==="color"){var pid=el.getAttribute("data-id");for(var i=0;i<ST.profiles.length;i++)if(ST.profiles[i].id===pid)ST.profiles[i].color=el.getAttribute("data-c");save();render();$("sbox").innerHTML=sheetSettings(false);}
  else if(a==="addp"){var np={id:uid(),name:"",grade:"",color:COLORS[ST.profiles.length%COLORS.length].id};ST.profiles.push(np);save();$("sbox").innerHTML=sheetSettings(false);}
  else if(a==="delp"){var did=el.getAttribute("data-id");if(ST.profiles.length>1&&confirm("이 아이를 지울까요?")){ST.profiles=ST.profiles.filter(function(q){return q.id!==did;});if(ST.current===did)ST.current=ST.profiles[0].id;save();render();$("sbox").innerHTML=sheetSettings(false);}}
  else if(a==="reset"){if(confirm("도장과 체크 기록을 모두 지울까요?")){ST.checks={};ST.stamps={};save();render();}}
});

/* ---------- start ---------- */
if(!ST.profiles.length){ST.profiles=[{id:uid(),name:"",grade:"",color:"blue"}];ST.current=ST.profiles[0].id;save();render();openSettings(true);}
tick();setInterval(tick,1000);
gInit();setInterval(refreshEvents,300000);
document.addEventListener("visibilitychange",function(){if(!document.hidden)refreshEvents();});
window.addEventListener("resize",function(){fitBlocks();if(!userMoved)scrollNow(false);});
requestAnimationFrame(function(){if(!userMoved)scrollNow(false);});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(function(){fitBlocks();if(!userMoved)scrollNow(false);});
})();
</script>
</body>
</html>
